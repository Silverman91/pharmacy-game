<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>على نفقة الدولة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Lalezar&display=swap">
<style>
/* One portrait stage: a tiny inpatient pharmacy seen from above, the door at the bottom, paperwork for every menu. */
:root{
  color-scheme:light;
  --paper:#f6f2e5; --paper2:#ebe5d0; --line:#b9c6d8; --ink:#17275c; --pen:#1f3fa8;
  --stamp:#b5231c; --ok:#1b7a55; --warn:#c77d0a; --night:#10211f; --mint:#5d9c88;
  --type:'Cairo',Tahoma,sans-serif; --head:'Lalezar','Cairo',Tahoma,sans-serif; --hand:'Aref Ruqaa','Cairo',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#norun{position:fixed;top:0;right:0;bottom:0;left:0;z-index:999;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;background:var(--paper);color:var(--ink);text-align:center;font-size:16px;line-height:1.6}
#norun h1{margin:0;font-size:24px;line-height:1.3;color:var(--stamp)}
#norun p{margin:0}
#norun .en{direction:ltr;font-size:14px;opacity:.8}
#norunErr{direction:ltr;font-size:12px;word-break:break-word}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--type)}
body{display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#stage{position:relative;height:100%;width:100%;max-width:min(480px,66vh);display:flex;flex-direction:column;background:#2a3b37;overflow:hidden}
canvas#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pen);outline-offset:1px}

#hud{background:var(--paper);border-bottom:2px solid var(--ink);padding:5px 8px 5px;display:grid;gap:3px}
.hrow{display:flex;align-items:center;gap:6px;min-width:0}
#dayLab{flex:1;min-width:0;font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{font-family:var(--head);font-size:21px;line-height:1;white-space:nowrap}
.icon{min-width:38px;height:32px;border:2px solid var(--ink);background:transparent;font-size:11px;font-weight:700;padding:0 3px;flex:none}
#fileWrap{flex:1;min-width:0}
.lab{font-size:11px;font-weight:700;white-space:nowrap}
#fileBar{height:10px;border:2px solid var(--ink);background:#fff;overflow:hidden}
#fileFill{height:100%;width:0;background:var(--stamp);transition:width .25s}
#clockBar{height:3px;background:var(--paper2)}
#clockFill{height:100%;width:0;background:var(--ink)}
#rages{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.rg{min-width:0}
.rg i{display:block;font-style:normal;font-size:10px;line-height:1.25;font-weight:700;white-space:nowrap}
.rg b{display:block;height:6px;border:1px solid var(--ink);background:#fff;overflow:hidden}
.rg b s{display:block;height:100%;width:0;background:var(--warn)}
.rg.hot i{color:var(--stamp)}
.rg.hot b s{background:var(--stamp)}

#bar{background:var(--paper);border-top:2px solid var(--ink);padding:6px 8px;display:grid;gap:5px;min-height:82px}
#intel{font-size:12px;line-height:1.35;height:49px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
#intel b{color:var(--stamp)}
#pills{display:flex;gap:5px;align-items:center;min-height:36px}
#pillList{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden;flex-wrap:wrap;max-height:36px}
.pill{font-size:10.5px;font-weight:700;line-height:16px;padding:0 6px;border:1.5px solid var(--ink);white-space:nowrap;background:#fff}
.pill.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.late{background:var(--stamp);color:#fff;border-color:var(--stamp)}
.btn{min-height:44px;padding:4px 10px;border:2px solid var(--ink);background:#fff;font-family:var(--head);font-size:17px;line-height:1.15}
.btn small{display:block;font-family:var(--type);font-size:11px;font-weight:400}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:#fff;font-size:21px;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
#speed{width:48px;min-height:36px;padding:0;flex:none}

/* The hands-on panel slides over the bottom of the room; the shift keeps running above it. */
#panel{position:absolute;left:0;right:0;bottom:0;height:min(47%,340px);z-index:3;display:flex;flex-direction:column;background:var(--paper);border-top:3px solid var(--ink);padding:6px 9px 8px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.phead b{font-family:var(--head);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap}
#pinfo{flex:1;min-width:0;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:44px;height:34px;border:2px solid var(--ink);background:#fff;font-size:12px;font-weight:700;padding:0;flex:none}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.idle{margin:auto;text-align:center;font-size:14px;line-height:1.5}
.sheetp{background:#fff;border:1.5px solid var(--line);padding:4px 8px;background-image:repeating-linear-gradient(transparent 0 21px,#dfe7f1 21px 22px);line-height:22px;font-size:12px;position:relative;min-height:0;overflow:hidden}
.hand{font-family:var(--hand);color:var(--pen);font-size:16px;font-weight:700}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.frow{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.meds{direction:ltr;text-align:left;font-family:var(--hand);color:var(--pen);font-size:16px;font-weight:700;line-height:22px}
.missing{color:#aab2bd;letter-spacing:2px}
.rettag{color:var(--stamp)}
.abline{font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden}
.abline .hand{font-size:13px}
.abline .missing{letter-spacing:1px}
.aw{font-style:normal;font-weight:700;padding:0 3px;border-radius:3px;color:#fff;font-size:9px}
.awA{background:#1b7a55}
.awW{background:#c77d0a}
.awR{background:#b5231c}
#panel.tall{height:min(55%,390px)}
#panel::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:5}
#panel.flash-ok::after{background:rgba(30,170,90,.55);animation:panelflash .45s ease-out}
#panel.flash-bad::after{background:rgba(205,40,30,.6);animation:panelflash .6s ease-out}
@keyframes panelflash{from{opacity:1}to{opacity:0}}
.ordcover{font-size:12px}
.ordcover .pageTag{position:static;display:inline-block;line-height:1.3}
.ordhint span{display:inline-block;direction:ltr;unicode-bidi:isolate;margin:0 3px}
.ordhint{font-size:10.5px;line-height:18px;font-weight:700;color:#5a6a8a;white-space:nowrap;overflow:hidden}
.ordlist{display:flex;flex-direction:column;gap:2px}
.ordrow{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) 38px 96px;align-items:center;gap:4px;min-height:33px}
.ordrate{color:var(--stamp);font-size:18px;text-align:center;line-height:1}
.ordval{font-size:17px;color:var(--pen);text-align:center}
.ordrow .retnum{grid-template-columns:32px 1fr 32px}
.ordrow .retnum .mini{min-height:30px;height:30px}
.signrow{flex:1;min-height:66px;display:flex;gap:6px}
.signrow #sig{flex:1;min-width:0;width:auto;height:auto;min-height:0}
.signrow .mini{flex:none;width:72px;font-size:12px}
.rethint{font-size:12px;font-weight:700;line-height:1.3}
.rethint.bad{color:var(--stamp)}
.retlist{display:flex;flex-direction:column;gap:3px}
.retrow{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) auto 104px;align-items:center;gap:6px;min-height:36px;background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:1px 4px 1px 7px}
.retname{font-size:13px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:left}
.retname small{display:block;font-size:10px;font-weight:400;color:#6b7690}
.ordrate.strip{font-size:11px;font-weight:700;color:var(--pen);text-align:center}
.retbag{display:grid;grid-template-columns:repeat(4,7px);gap:2px}
.retbag i{display:block;width:7px;height:12px;border-radius:2px 2px 3px 3px;background:linear-gradient(#e9f0f6,#9db4c6);border:1px solid #5d7386}
.retnum{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center}
.retnum b{font-size:17px;color:var(--pen)}
.retnum .mini{min-height:32px;height:32px;padding:0;font-size:18px;line-height:1}
.retgo{flex:none;min-height:44px}
.retgo[data-act=retSend]{font-size:18px}
.retsum{direction:ltr;font-size:12.5px;font-weight:700}
.retsum div>span:first-child{unicode-bidi:plaintext}
.retsum div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.retsum .hand{direction:ltr}
.retdone{text-align:center;color:var(--stamp);font-size:22px;line-height:28px;transform:rotate(-3deg)}
.drsig{width:54px;height:16px;vertical-align:middle;overflow:visible}
.drsig path{fill:none;stroke:var(--pen);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pageTag{position:absolute;top:2px;left:5px;font-size:10px;font-weight:700;color:var(--stamp);background:#fff;padding:0 3px;line-height:16px}
#sig{flex:1;min-height:58px;width:100%;display:block;border:2px dashed var(--pen);background:#fbfaf3;touch-action:none}
.brow{display:flex;gap:6px}
.brow>*{flex:1;min-width:0}
.mini{min-height:42px;border:2px solid var(--ink);background:#fff;font-size:13px;font-weight:700;line-height:1.15;padding:2px 4px}
.mini small{display:block;font-weight:400;font-size:10.5px}
.mini.red{background:#c9302a;color:#fff;border-color:#7c1410}
.mini.amb{background:#f0a818;border-color:#8a5c00}
.mini.blu{background:#2d6fc4;color:#fff;border-color:#123c78}
.mini.good{background:#e1f3ea;border-color:var(--ok)}
.mini.warn{border-color:var(--stamp);color:var(--stamp)}
.chips{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.chip{direction:ltr;display:flex;justify-content:space-between;gap:6px;min-height:40px;align-items:center;width:100%;border:2px solid var(--line);background:#fff;padding:0 8px;font-size:13px;font-weight:700}
.chip.on{border-color:var(--pen);background:#eef2fd}
.chip.ok{color:var(--pen);font-family:var(--hand);border-color:transparent;background:transparent;min-height:26px}
.chip[disabled]{cursor:default}
.ctable{display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:1;min-height:0;overflow:hidden}
.crow{direction:ltr;text-align:left;border:1.5px solid var(--ink);background:#fff;padding:1px 5px;font-size:11px;line-height:1.2;min-height:38px;display:flex;flex-direction:column;justify-content:center}
.crow b{font-size:11.5px}
.crow span{display:flex;justify-content:space-between;font-weight:700;color:#000}
.cline{direction:ltr;display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:700;line-height:18px;white-space:nowrap}
.cline.cur{color:var(--pen);background:#eef2fd}
.cline.dn{color:var(--pen);font-family:var(--hand);font-size:14px}
.card{background:#fff;border:2px solid var(--ink);padding:6px 8px;text-align:center}
.card .big{direction:ltr;font-size:19px;font-weight:700;line-height:1.25;display:block}
.card .sub{font-size:11.5px;line-height:1.3;display:block}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;direction:ltr}
.key{min-height:42px;border:2px solid var(--ink);background:#fff;font-size:18px;font-weight:700;padding:0}
.xlbar{height:8px;border:1.5px solid var(--ink);background:#fff;margin-top:3px}
.xlbar s{display:block;height:100%;background:var(--ok)}
.num{direction:ltr;font-family:Consolas,monospace;font-weight:700;font-size:22px;letter-spacing:2px;line-height:1.1}
.num u{color:var(--pen)}
.sum{direction:ltr;font-size:15px;font-weight:700;display:block;line-height:1.35}

#sheet,#modal{position:absolute;inset:0;background:rgba(9,20,18,.62);display:flex;z-index:5}
#sheet{align-items:flex-end}
#modal{align-items:center;padding:10px;overflow:auto;z-index:6}
.paper{position:relative;width:100%;background:var(--paper);padding:13px;border:2px solid var(--ink);max-height:100%;overflow:auto;background-image:repeating-linear-gradient(transparent 0 25px,rgba(23,39,92,.07) 25px 26px)}
#sheet .paper{max-height:84%;border-width:2px 0 0}
.formhead{font-size:11px;display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:9px}
h1,h2{font-family:var(--head);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(44px,14vw,60px)}
h2{font-size:27px;margin-bottom:6px}
p{margin:0 0 8px;font-size:14.5px;line-height:1.55}
ul.tight{margin:0 0 10px;padding:0 18px 0 0;font-size:13.5px;line-height:1.5}
.stampmark{display:inline-block;font-family:var(--head);color:var(--stamp);border:3px solid var(--stamp);padding:2px 9px;font-size:27px;transform:rotate(-4deg);margin:2px 0 10px;background:rgba(255,255,255,.35)}
.opt{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:right;background:#fff;border:2px solid var(--ink);padding:7px 9px;margin-bottom:6px;font-size:12px;line-height:1.3;min-height:44px}
.opt .nm{font-family:var(--head);font-size:18px}
.opt .pr{font-family:var(--head);font-size:18px;white-space:nowrap}
.opt .ds{grid-column:1/-1;margin-top:1px}
.opt.owned{background:#e1f3ea;border-color:var(--ok);cursor:default}
.opt.locked{opacity:.5;cursor:default}
.opt.next.cant{border-style:dashed}
.charge{font-size:13px;line-height:1.5;margin:0 0 10px;padding:0 18px 0 0}
.score{font-family:var(--head);font-size:30px;line-height:1.15;margin:2px 0 8px}
.tally{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:13.5px;line-height:1.7;margin-bottom:8px}
.tally b{white-space:nowrap}
.tally .bad{color:var(--stamp)}

#ev{position:absolute;left:8px;right:8px;z-index:4;background:linear-gradient(#fff8d8,#fbeeb4);border:2px solid var(--ink);border-radius:10px;padding:5px 8px 6px;box-shadow:0 6px 16px rgba(10,20,20,.45);animation:paperin .18s ease-out}
.evh b{font-family:var(--head);font-weight:400;font-size:17px;color:var(--stamp);line-height:1.15}
.evd{font-size:12.5px;line-height:1.35;margin:1px 0 5px}
.evbar{height:5px;border-radius:3px;background:rgba(23,39,92,.18);margin-top:5px;overflow:hidden}
.evbar s{display:block;height:100%;width:100%;background:var(--stamp)}

/* Finish: rounded corners, depth and a press on everything you touch. */
#stage{box-shadow:0 0 40px rgba(0,0,0,.5);background:linear-gradient(#2a3b37,#1c2a27)}
#hud{background:linear-gradient(#fbf8ee,#f1ecdb);box-shadow:0 2px 8px rgba(10,20,20,.35);position:relative;z-index:2}
#dayLab{font-size:13.5px}
#cash{color:var(--ok);font-size:15px;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.icon{border-radius:7px;background:#fff;box-shadow:0 2px 0 var(--ink)}
.icon:active,.btn:active,.mini:active,.key:active,.x:active,.chip:active{transform:translateY(2px);box-shadow:none}
#fileBar{border-radius:6px;height:11px}
#fileFill{background:repeating-linear-gradient(-45deg,#c9302a 0 6px,#a4231d 6px 12px);border-radius:4px}
.rg b{border-radius:4px}
.rg b s{background:linear-gradient(#e7a02b,#c77d0a)}
.rg.hot b s{background:linear-gradient(#df4a40,#b5231c);animation:hotpulse .7s infinite alternate}
@keyframes hotpulse{to{opacity:.62}}
#clockBar{border-radius:2px;overflow:hidden}
#clockFill{background:linear-gradient(90deg,var(--ink),var(--pen))}
#bar{background:linear-gradient(#f1ecdb,#fbf8ee);box-shadow:0 -2px 8px rgba(10,20,20,.35);position:relative;z-index:2}
.pill{border-radius:9px;line-height:18px}
.btn{border-radius:9px;background:#fff;box-shadow:0 3px 0 var(--ink);transition:transform .05s}
.btn.primary{background:linear-gradient(#d33a31,#ab1f18);border-color:#7c1410;box-shadow:0 4px 0 #7c1410;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.btn.primary:active{box-shadow:0 1px 0 #7c1410}
#panel{border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(10,20,20,.42);animation:slideup .16s ease-out;background:linear-gradient(#fbf8ee,#f1ecdb)}
@keyframes slideup{from{transform:translateY(24px);opacity:.3}}
.x{border-radius:7px;box-shadow:0 2px 0 var(--ink)}
.sheetp{border-radius:4px;box-shadow:0 1px 3px rgba(10,20,20,.2)}
#sig{border-radius:6px}
.mini{border-radius:8px;box-shadow:0 2px 0 rgba(23,39,92,.75)}
.chip{border-radius:7px}
.crow{border-radius:5px}
.card{border-radius:8px;box-shadow:0 2px 0 rgba(23,39,92,.5)}
.key{border-radius:7px;box-shadow:0 2px 0 var(--ink)}
.xlbar{border-radius:4px}
#sheet,#modal{background:rgba(9,20,18,.7)}
.paper{border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:paperin .2s ease-out;background-image:linear-gradient(90deg,transparent calc(100% - 15px),rgba(181,35,28,.28) calc(100% - 15px),rgba(181,35,28,.28) calc(100% - 14px),transparent calc(100% - 14px)),repeating-linear-gradient(transparent 0 25px,rgba(23,39,92,.07) 25px 26px)}
@keyframes paperin{from{transform:translateY(14px) rotate(-.6deg);opacity:.2}}
#sheet .paper{border-radius:14px 14px 0 0}
.opt{border-radius:8px}
ul.tight{font-size:12.8px;line-height:1.42}
.stampmark{border-radius:6px}
#musicBtn{min-width:0;padding-left:9px;padding-right:9px;flex:none}
#dayLab{min-width:0;flex:1 1 auto}
.restgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;font-weight:700;font-size:12px;line-height:1.45}
.appbtn{flex:none;width:100%;margin-bottom:4px}
.appbroken{flex:none;font-size:12px;font-weight:700;color:var(--stamp);margin-bottom:4px;line-height:1.3}
#waping{position:absolute;left:10px;right:10px;z-index:4;background:#fff;color:#111;border-right:5px solid #25a35a;border-radius:9px;padding:4px 10px 6px;font:400 13px/1.4 'Cairo',sans-serif;box-shadow:0 5px 14px rgba(10,20,20,.45);pointer-events:none}
#waping i{display:block;font-style:normal;font-weight:700;font-size:11px;color:#075e54}
.memosign{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;line-height:1.3;margin:4px 0 8px}
.memosign .stampmark{font-size:22px;margin:0}
.memosign .hand svg{height:22px;vertical-align:middle}
.wa{margin:-13px -13px 9px;background:#e5ddd5;border-radius:8px 8px 0 0;overflow:hidden}
.wahead{background:#075e54;color:#fff;padding:7px 12px;font:700 14px 'Cairo',sans-serif}
.wahead small{display:block;font-weight:400;font-size:10.5px;opacity:.85;line-height:1.3}
.wabody{padding:9px;display:flex;flex-direction:column;gap:6px}
.wamsg{background:#fff;border-radius:9px;border-top-right-radius:2px;padding:4px 9px 3px;max-width:92%;align-self:flex-start;font:400 13px/1.45 'Cairo',sans-serif;color:#111;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.wamsg i{display:block;font-style:normal;font-weight:700;font-size:11.5px}
.wamsg time{display:block;font-size:9.5px;color:#6f7f7a;text-align:left;direction:rtl}
</style>
</head>
<body>
<!-- Shown until the game's script has started. An iPhone's file preview never runs scripts, so this is all it can show. -->
<div id="norun">
  <h1>اللعبة مش هتشتغل من هنا</h1>
  <p>الآيفون بيفتح الملف كمعاينة بس، والمعاينة مش بتشغّل اللعبة.</p>
  <p>اطلب <b>رابط</b> اللعبة وافتحه في Safari.</p>
  <p class="en">iPhone only previews this file and the preview can't run the game. Ask for a link and open it in Safari.</p>
  <p id="norunErr"></p>
</div>
<script>window.onerror=function(m,u,l){var e=document.getElementById('norunErr');if(e)e.textContent='Error: '+m+' (line '+l+')';};</script>
<div id="stage">
  <div id="hud">
    <div class="hrow">
      <div id="dayLab"></div>
      <div id="cash"></div>

function jobChips(){
 const seen=new Set(),out=[],dr=STN.review.r;
 for(const n of S.q){
  if(!n.virtual)continue;
  const k=orderKey(n);if(seen.has(k))continue;seen.add(k);
  const who=S.ph.find(p=>p.job===k)||S.ph.find(p=>p.doing===k);
  out.push({key:k,who,ret:!!n.ret,prep:n.k==='prep',name:n.ret?'مرتجع '+(BOX_NAMES[n.sheet.ward]||''):(n.k==='prep'?'تحضير ':'')+(BOX_NAMES[k.ward]||k.ward)});
 }
 // Returns live in their own stack; orders keep the desk. The first return still gets a chip so it can be picked.
 const orders=out.filter(c=>!c.ret),rets=out.filter(c=>c.ret),show=orders.slice(0,rets.length?3:4).concat(rets.slice(0,4-Math.min(3,orders.length)));
 show.forEach((c,i)=>{c.x=dr.x+1+(i%2)*55;c.y=dr.y+17+Math.floor(i/2)*15;c.w=53;c.h=13;});
 return show;
}
function jobAt(x,y){

 const dr=STN.review.r,first=S.q.find(n=>n.virtual&&n.ret&&!S.ph.some(p=>p.job===n));
 if(first&&x>=dr.x-4&&x<=dr.x+dr.w+4&&y>=dr.y+dr.h&&y<=dr.y+dr.h+24)return first;
 return null;
}

function setRoute(p){
 const a=behindDesk(p.y),b=behindDesk(p.ty);
 const c=a===b?[]:b?AISLE:[...AISLE].reverse();
 p.via=c[0]||null;p.via2=c[1]||null;p.via3=c[2]||null;
}
function moveTo(p,dt,sp){
 let gx=p.tx,gy=p.ty;
 if(p.via){gx=p.via.x;gy=p.via.y;}
 if(p.y>L.room&&gy<=L.room){p.x=-14;p.y=L.doorY;} // Steps in through the door.
 else if(p.y<=L.room&&gy>L.room){
  if(Math.hypot(p.x+14,p.y-L.doorY)<4){p.x=gx;p.y=gy;return !p.via;} // Gone through it.
  gx=-14;gy=L.doorY;
 }
 const dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);
 if(d<2){if(p.via&&(gx===p.via.x&&gy===p.via.y)){p.via=p.via2||null;p.via2=p.via3||null;p.via3=null;}return !p.via&&Math.hypot(p.tx-p.x,p.ty-p.y)<3;}
 const st=Math.min(d,sp*dt);p.x+=dx/d*st;p.y+=dy/d*st;p.walk+=dt*9;
 return false;
}
function nearCount(x,y,r){let c=0;for(const n of S.q){if(Math.abs(n.x-x)<r&&Math.abs(n.y-y)<r&&n.y<L.room)c++;}return c;}
function stepPh(p,dt){
 if(!p.on)return;
 if(p.lateT>0){if(S.phase==='day'){p.lateT-=dt;if(p.lateT<=0)arrive(p);}return;}
 if(p.busy>0)p.busy-=dt;
 if(p.wired>0)p.wired-=dt;
 if(p.cupHold>0){p.cupHold-=dt;if(p.cupHold<=0)p.cup=false;}
 if(p.brewT>0){
  if(S.power<=0&&S.phase==='day'){
   p.brewT-=dt;p.bubT=(p.bubT||0)-dt;
   if(p.askT>0){p.askT-=dt;if(p.askT<=0){
    const a=S.ph.find(x=>x.apps&&x.on&&!(x.lateT>0));
    if(a){p.atefCoffee=Math.random()<.35;say(a,pick(p.atefCoffee?['ماشي، فنجان صغير','طالما هتعمل، ماشي','مظبوطة لو سمحت']:['لا شكرا، بعدين','مش دلوقتي، البرنامج شغال','أنا لسه شارب شاي']),2);}
   }}
   if(p.bubT<=0){p.bubT=.28;sfx('burble');}
   if(p.brewT<=0)coffeeDone(p);
  }
  return;
 }
 if(p.path.length){
  const w=p.path[0],dx=w.x-p.x,dy=w.y-p.y,d=Math.hypot(dx,dy);
  const sp=98*Math.max(.3,1-.12*nearCount(p.x,p.y,34));
  if(d<2){p.path.shift();if(!p.path.length){p.arrived=true;p.x=w.x;p.y=w.y;if(p.trip==='out'){p.trip='away';p.arrived=false;p.lateT=p.tripT;}else if(p.trip==='back')p.trip=null;if(p.leaving){p.leaving=false;p.lateT=1e9;}if(p.toWash){p.toWash=false;p.washing=true;p.lateT=rnd(3.5,5.5);say(p,'هغسل الكنكة الأول',1.6);sfx('door');sfx('water');}else if(p.wantCoffee){p.wantCoffee=false;startBrew(p);}}}
  else{const st=Math.min(d,sp*dt);p.x+=dx/d*st;p.y+=dy/d*st;p.walk+=dt*10;}
 }
 else if(p.cupT>0&&S.phase==='day'){
  p.cupT-=dt;p.busy=.2;
  if(p.cupT<=0){if(p.bored)say(p,pick(CUP_DONE),2);else if(Math.random()<.6)say(p,pick(REST_DONE),1.8);p.cup=false;p.busy=0;if(p.cupSeat){p.cupSeat=null;setPath(p);}}
 }
 else if(Math.random()<dt*(p.bored?(isIdle(p)?.09:.05):.022)&&S.phase==='day')say(p,p.bored&&!p.sulk&&Math.random()<.8?boredLine(p):pick(p.sulk?SULK_LINES:p.proud&&Math.random()<.5?PROUD_LINES:learnt(p)<1?NEW_LINES:Math.random()<.25?LINES.ph:p.lines),2.2);
}

function workReview(dt){
 const team=reviewTeam(),byHand=S.panel==='review'?1:0;
 const claimed=new Set(),jobs=[]; // One pharmacist on one whole order, and only the one you put on it.
 for(const p of S.ph){p.working=false;p.doing=null;}
 // Working the desk by hand stands in for whoever is on that order, or else someone with nothing assigned.
 let handP=null;
 if(byHand&&S.q[0]){
  const k=orderKey(S.q[0]);claimed.add(k);
  handP=team.find(p=>p.job===k)||team.find(p=>!p.job)||team[0]||null;
  if(handP){handP.working=true;handP.doing=k;}
 }
 const take=(p,n)=>{const k=orderKey(n);claimed.add(k);jobs.push([p,n]);p.working=true;p.doing=k;if(n.virtual){n.x=n.tx=p.x;n.y=n.ty=p.y;}};
 const workers=team.filter(p=>p!==handP);
 for(const p of workers){
  if(p.job&&!S.q.some(x=>orderKey(x)===p.job))p.job=null;
  if(p.job&&!claimed.has(p.job))take(p,S.q.find(x=>orderKey(x)===p.job));
 }
 // Only people standing at the desk get served without being assigned: doctors, the head nurse, a nurse with a signed return.
 for(const p of workers){
  if(p.job||p.doing)continue;

function initSig(){
 const c=$('sig'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);
 const g=c.getContext('2d');g.scale(dpr,dpr);
 const n=S.q[0];
 g.font="700 15px 'Cairo',sans-serif";g.fillStyle='#9aa8c9';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
 g.fillText(n&&n.ret?'اكتب هنا: تم الارتجاع':'امضي هنا بصباعك',r.width/2,r.height/2);
 let last=null,total=0;const need=Math.min(150,r.width*.42)/handSkill('review')*(n&&n.ret?1.5:1);
 const pos=e=>{const b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
 c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId);}catch(_){ }last=pos(e);S.sigBusy=true;sfx('sign');};
 c.onpointermove=e=>{
  if(!last)return;
  const p=pos(e);g.strokeStyle='#1f3fa8';g.lineWidth=2.6;g.lineCap='round';
  g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();
  const d=Math.hypot(p.x-last.x,p.y-last.y);total+=d;last=p;
  if(Math.floor(total/45)!==Math.floor((total-d)/45))sfx('sign');
  if(total>=need){last=null;S.sigBusy=false;c.onpointermove=null;signed(n);}
 };
 c.onpointerup=c.onpointercancel=()=>{last=null;S.sigBusy=false;};
}

function tomorrowText(){
 const off=S.ph.filter(p=>p.off===dow()&&!p.noRest).map(p=>p.name+(p.f?' إجازتها':' إجازته'));
 const noRest=S.ph.filter(p=>p.off===dow()&&p.noRest).map(p=>'راحة '+p.name+' اتلغت');
 const lp=S.leaveTomorrow!=null?S.ph[S.leaveTomorrow]:null,lv=lp?lp.name+(lp.f?' واخدة اعتيادي':' واخد اعتيادي'):null;
 const ann=S.ph.filter(p=>emanLeaveToday(p)).map(p=>p.name+' واخدة اعتيادي');
 const parts=[];
 if(off.length)parts.push(off.join(' و'));
 if(noRest.length)parts.push(noRest.join(' و'));
 if(ann.length)parts.push(ann.join(' و'));
 if(lv)parts.push(lv);
 if(S.comments.length)parts.push('ملاحظات الجودة لسه مفتوحة على الجروب');
 if(Math.min(...S.stock)<25)parts.push('الرف قرب يخلص، اكتب طلب المخزن بدري');
 if(dow()===4)parts.push('الباطنة والسكتة بياخدوا ٣ أيام');
 if(dow()===5)parts.push('الرعايات بتاخد يومين عشان الجمعة');
 parts.push(S.dom===1?'د. هايدي هتراجع المنصرف الشهري':S.dom===2?'د. هايدي هتراجع الأسعار':haidyIn()?'د. هايدي ممكن تعدي':'د. هايدي إجازة');
 const ded=WEEK_TASKS[dow()]?[WEEK_TASKS[dow()].n]:[];if(S.dom===MONTH_DAYS-2)ded.push('الجرد الشهري ومراجعة المنصرف');if(lastDay())ded.push('المنصرف الشهري والمضاد الحيوي واستهلاك العهدة');if(S.dom<=2&&!S.pricesOk)ded.push('تحديث الأسعار');if(S.ledCarry)ded.push('وارد العهدة');
 return `<b>بكرة ${DAYS[dow()]}.</b> ${parts.join('، ')+'.'} ${ded.length?'مطلوب: '+ded.join(' و')+'.':''} ${S.recs?'معاك توصية: دوس على مكتب واستخدمها.':'دوس على أي مكتب تشوف فاضله إيه.'}`;
}

// Everyone mumbles when they talk: higher for women, and a few syllables per line.
let voiceT=0;
function voice(p,text){
 if(!ac||muted||perfT<voiceT)return;
 const fem=p.f||p.fem,base=(fem?285:185)*(.94+((p.seed||p.id/7||.5)%1)*.12);
 const n=clamp(2+Math.floor(text.length/7),2,5),t=ac.currentTime+.01,vol=.075;
 try{
  const os=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();
  os.type='triangle';fl.type='lowpass';fl.frequency.value=fem?1500:1200;fl.Q.value=.5;
  os.frequency.setValueAtTime(base,t);g.gain.setValueAtTime(0,t);
  let at=t;
  for(let i=0;i<n;i++){
   const len=rnd(.1,.17),f=base*rnd(.93,1.09)*(1-.07*i/n); // Each syllable a little lower, like a sentence ending.
   os.frequency.linearRampToValueAtTime(f,at+.035);
   g.gain.linearRampToValueAtTime(vol,at+.03);
   g.gain.linearRampToValueAtTime(vol*.7,at+len*.7);
   g.gain.linearRampToValueAtTime(.0005,at+len);
   at+=len+rnd(.02,.05);
  }
  os.connect(fl);fl.connect(g);g.connect(master);os.start(t);os.stop(at+.05);
  voiceT=perfT+(at-t)+.3;
 }catch(e){}
}

const MUSIC_BARS=[
 [[57,60,64,67,71],[53,57,60,64,67],[48,55,60,64,71],[52,55,59,62,66]],
 [[50,57,60,65,69],[57,60,64,67,72],[53,60,64,69,72],[55,59,62,64,69]],
];
const MUSIC_SCALE=[69,72,74,76,79,81,84,86];
const mtof=m=>440*Math.pow(2,(m-69)/12);
let musicNext=0,musicBar=0,musicNote=71;
function felt(t,m,vol){

 tone(t,{f:f*2,vol:vol*.25,dur:1.1,atk:.008,bus:musicBus});
}
function padNote(t,m,dur,vol){
 {
  const os=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
  os.type='triangle';os.frequency.value=mtof(m);
  fl.type='lowpass';fl.frequency.setValueAtTime(800,t);fl.frequency.linearRampToValueAtTime(1300,t+dur*.5);fl.frequency.linearRampToValueAtTime(800,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.linearRampToValueAtTime(vol*.8,t+dur*.7);g.gain.linearRampToValueAtTime(.0001,t+dur+.8);

function musicTick(){
 if(!ac||!musicBus||!musicOn||muted||ac.state!=='running')return;
 const now=ac.currentTime;
 if(musicNext<now)musicNext=now+.15;
 while(musicNext<now+.8){
  const beat=1.05,t=musicNext,prog=MUSIC_BARS[Math.floor(musicBar/8)%2],ch=prog[musicBar%4];
  padNote(t,ch[0]-12,beat*4,.06);
  for(const m of ch.slice(1,3))padNote(t,m,beat*4,.032);
  tone(t,{f:mtof(ch[0]-12),vol:.05,dur:beat*2.5,atk:.15,bus:musicBus,lp:300});
  // A few notes, wandering by small steps, with plenty of air between them.
  for(let b=0;b<4;b++)for(const off of [0,.5]){
   if(Math.random()<(off?.14:.34)){
    const i=MUSIC_SCALE.indexOf(musicNote),nx=clamp((i<0?2:i)+pick([-2,-1,-1,1,1,2]),0,MUSIC_SCALE.length-1);
    musicNote=MUSIC_SCALE[nx];
    felt(t+(b+off)*beat+rnd(0,.03),musicNote,rnd(.055,.08));
   }
  }
  musicNext+=beat*4;musicBar++;
 }
}

function isIdle(p){

/* ---------- Loop ---------- */
let last=performance.now(),hudT=0,lastDraw=0,gapAvg=16,drawAvg=16,paintAvg=2;
function frame(now){
 const gap=now-last,dt=Math.min(.05,gap/1000);last=now;perfT=now/1000;
 const halted=!$('modal').hidden||!$('sheet').hidden;
 if(!halted){
  const slow=S.panel==='review'?.6:1; // Time eases off while you review by hand, to be fair.
  for(let i=0;i<S.speed;i++)step(dt*slow);
  for(const f of S.fx)f.t+=dt;
  S.fx=S.fx.filter(f=>f.t<f.life);
  if(S.shake>0)S.shake-=dt;
  ambientSfx(dt);
  if(S.intelT>0)S.intelT-=dt;
 }
 musicTick();
 if(!halted&&gap<200)gapAvg+=(gap-gapAvg)*.03;
 if(now-lastDraw>=(halted?60:gapAvg<10?13:0)){
  if(!halted&&now-lastDraw<300)drawAvg+=(now-lastDraw-drawAvg)*.03;
  const t0=performance.now();render();paintAvg+=(performance.now()-t0-paintAvg)*.03;
  lastDraw=now;
 }
 hudT-=dt;
 if(hudT<=0){updateHud();hudT=.2;}
 requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
